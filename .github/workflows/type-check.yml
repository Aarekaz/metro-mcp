name: type-check

# Run unit, type, and Worker-bundle checks. The current Agents/Zod toolchain no
# longer exhausts the GitHub runner while resolving MCP tool schemas.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests and coverage
        run: bun run test:coverage

      - name: Type check
        run: bun run type-check

      - name: Worker bundle dry-run
        run: bunx wrangler deploy --dry-run --outdir /tmp/metro-mcp-dry-run
